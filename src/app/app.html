<h1>API Service</h1>
<p>Total: {{ userList.length }}</p>
<h6>hey man</h6>

<form #userForm="ngForm"  (ngSubmit)="addUser(userForm.value)">
    <input type="text" name="name" id="" placeholder="enter name" ngModel>
    <br><br>
    <input type="text" name="age" id="" placeholder="enter age" ngModel>
    <br><br>
    <input type="text" name="email" id="" placeholder="enter email" ngModel>
    <br><br>
    <button>Add User</button>
</form>
<h4>you will see content when you click on the any input field then click outside  dont know what is the issue</h4>
@for( p of userList;track p.id){
    <ul>
        <li>{{p.name}}</li>
        <li>{{p.age}}</li>
        <li>{{p.email}}</li>
        <!-- <li><img src="{{p.thumbnail}}" alt=""></li> -->
         <li><button (click)="deleteUser(p.id)">Delete</button></li>
    </ul>
}
